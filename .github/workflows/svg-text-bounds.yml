name: SVG-tekstcontrole

on:
  pull_request:
    paths:
      - "docs/assets/*.svg"
      - "scripts/check-svg-text-bounds.sh"
      - ".github/workflows/svg-text-bounds.yml"

permissions:
  contents: read

jobs:
  svg-text-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - name: Installeer Playwright + Chromium
        run: uv run playwright install chromium --with-deps --only-shell
      - name: Controleer tekst binnen viewBox
        run: uv run bash scripts/check-svg-text-bounds.sh
