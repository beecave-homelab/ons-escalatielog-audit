name: SVG-tekstcontrole

on:
  pull_request:
    paths:
      - "docs/assets/*.svg"
      - "scripts/check-svg-text-bounds.sh"
      - ".github/workflows/svg-text-bounds.yml"

permissions:
  contents: read

jobs:
  svg-text-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - name: Installeer Playwright + Chromium
        run: uv run playwright install chromium --with-deps --only-shell
      - name: Controleer tekst binnen viewBox
        run: uv run bash scripts/check-svg-text-bounds.sh
