name: Productiedocumentatie

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-docs:
    name: Productiedocumentatie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Controleer volledige resulterende Git-boom
        run: python scripts/check-production-docs.py --revision HEAD
