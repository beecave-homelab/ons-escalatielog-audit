name: Volledige controles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Versiecontrole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python scripts/check_release_version.py
      - name: Controleer productwijzigingen naar main
        if: contains(fromJSON('["pull_request", "merge_group", "push"]'), github.event_name)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python scripts/check_main_version.py --base "$BASE_SHA" --head HEAD

  checks:
    name: Volledige CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run playwright install chromium --with-deps --only-shell
      - name: Kies de aparte Chromium-testbrowser
        run: |
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              from pathlib import Path
              root = Path(pw.chromium.executable_path).parents[2]
              executable = next(root.glob("chromium_headless_shell-*/chrome-linux/headless_shell"))
              print(f"PLAYWRIGHT_CHROMIUM_EXECUTABLE={executable}")
          PY
      - run: scripts/run-checks.sh
