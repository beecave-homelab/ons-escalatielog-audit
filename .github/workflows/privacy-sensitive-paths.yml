name: Privacygevoelige paden

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-sensitive-paths:
    name: Blokkeer escalatielogs en exports
    runs-on: ubuntu-latest
    steps:
      - name: Check repository uit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controleer huidige Git-index
        run: scripts/check-sensitive-paths.sh --index

      - name: Controleer commits in pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-sensitive-paths.sh --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Controleer commits in push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            scripts/check-sensitive-paths.sh --range "${HEAD_SHA}^!"
          else
            scripts/check-sensitive-paths.sh --range "${BEFORE_SHA}..${HEAD_SHA}"
          fi
