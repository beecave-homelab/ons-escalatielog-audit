name: Publiceer Pages-showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: Leg publicatiecommit vast
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - id: pin
        shell: bash
        env:
          START_REF: ${{ github.ref }}
          START_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$START_REF" = refs/heads/main
          [[ ${#START_SHA} -eq 40 && "$START_SHA" != *[!0-9a-f]* ]] || exit 1
          CURRENT_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$START_SHA" = "$CURRENT_SHA"
          echo "sha=$START_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: pin
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.pin.outputs.sha }}

  deploy:
    name: Publiceer uitsluitend de webui
    needs: [pin, verify]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Maak een leeg publicatieartefact
        id: stage
        run: |
          test -f escalatielog-audit-webui.html
          test ! -L escalatielog-audit-webui.html
          PAGES_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/pages.XXXXXX")"
          cp escalatielog-audit-webui.html "$PAGES_DIRECTORY/"
          cmp escalatielog-audit-webui.html "$PAGES_DIRECTORY/escalatielog-audit-webui.html"
          echo "path=$PAGES_DIRECTORY" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.stage.outputs.path }}
      - name: Controleer main opnieuw vóór publicatie
        id: current
        shell: bash
        env:
          START_REF: ${{ github.ref }}
          START_SHA: ${{ needs.pin.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$START_REF" = refs/heads/main
          [[ ${#START_SHA} -eq 40 && "$START_SHA" != *[!0-9a-f]* ]] || exit 1
          CURRENT_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$START_SHA" = "$CURRENT_SHA"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
